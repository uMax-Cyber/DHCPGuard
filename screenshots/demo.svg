<svg width="800" height="280" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="280" fill="#1e1e2e" rx="8"/>
<rect width="800" height="30" fill="#181825" rx="8"><animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/></rect>
<circle cx="20" cy="15" r="6" fill="#f38ba8"/><circle cx="40" cy="15" r="6" fill="#f9e2af"/><circle cx="60" cy="15" r="6" fill="#a6e3a1"/>
<text x="400" y="20" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12" opacity="0">DHCPGuard — Sophos DHCP<animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="55" fill="#a6e3a1" font-family="monospace" font-size="13" opacity="0">$ python3 scripts/sophos_api.py gw1 DHCPServer<animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="90" fill="#89b4fa" font-family="monospace" font-size="13" opacity="0">Scope: 10.0.1.50-10.0.1.250 (201 addrs)<animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="120" fill="#cdd6f4" font-family="monospace" font-size="13" opacity="0">Static leases: 4 | ConflictDetect: Enable<animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="150" fill="#f9e2af" font-family="monospace" font-size="13" opacity="0">🔴 ALERT: MAC aa:bb:cc has static in scope-A but connects to scope-B<animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" values="1;0.6;1" begin="2.2s" dur="1.5s" repeatCount="indefinite"/></text>
<text x="15" y="180" fill="#f9e2af" font-family="monospace" font-size="13" opacity="0">   → Silent denial: server will NOT respond to this device<animate attributeName="opacity" values="0;1" begin="2.3s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" values="1;0.6;1" begin="2.7s" dur="1.5s" repeatCount="indefinite"/></text>
<text x="15" y="220" fill="#a6e3a1" font-family="monospace" font-size="13" opacity="0">✓ Completed successfully<animate attributeName="opacity" values="0;1" begin="2.8s" dur="0.4s" fill="freeze"/></text>
<rect x="205" y="207" width="10" height="16" fill="#a6e3a1" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="3.2s" dur="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" begin="3.4s" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
